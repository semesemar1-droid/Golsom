  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { 
      height:100vh; display:flex; justify-content:center; align-items:center; 
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #ff00ff);
      background-size: 400% 400%;
      animation: gradient 10s ease infinite;
      color:#fff; font-family: 'Poppins', sans-serif;
    }
    @keyframes gradient {
      0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;}
    }
    .card {
      background: rgba(0,0,0,0.3); backdrop-filter: blur(20px);
      border-radius: 25px; padding: 30px 25px; text-align:center;
      width: 90%; max-width: 420px; box-shadow: 0 0 40px rgba(231,60,126,0.5);
      border: 1px solid rgba(255,255,255,0.2); animation: fadeIn 0.8s ease;
    }
    @keyframes fadeIn { from{opacity:0; transform:scale(0.9)} to{opacity:1; transform:scale(1)} }
    
    .card img { 
      width:100%; border-radius:18px; margin-bottom:20px; 
      animation: float 3s ease-in-out infinite;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

    h2 { font-size: 22px; font-weight:700; margin-bottom: 8px; }
    p { font-size: 14px; opacity: 0.9; margin-bottom: 25px; }

    .dots span {
      display:inline-block; width:12px; height:12px; margin:0 5px;
      background:#fff; border-radius:50%; box-shadow:0 0 10px #fff;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .dots span:nth-child(1){animation-delay:-0.32s}
    .dots span:nth-child(2){animation-delay:-0.16s}
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.2); } }
    
    .progress-bar {
      width:100%; height:6px; background:rgba(255,255,255,0.2); border-radius:10px; overflow:hidden; margin-top:20px;
    }
    .progress {
      height:100%; width:0%; background:linear-gradient(90deg, #e73c7e, #ff00ff); border-radius:10px;
      animation: load 3s linear forwards; box-shadow:0 0 15px #ff00ff;
    }
    @keyframes load { to { width:100%; } }
    #timer { margin-top:12px; font-size:13px; font-weight:600; }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://res.cloudinary.com/wfovjlto/image/upload/v1786881892/ugaqzd4sjyoo6yboqleg.jpg" alt="Thumbnail">

    <p>Please wait 3 seconds</p>
    
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="progress-bar"><div class="progress"></div></div>
    <div id="timer">Redirect in 3 seconds</div>
  </div>

  <script>
    let count = 3;
    const timer = document.getElementById('timer');
    const interval = setInterval(() => {
      count--;
      timer.innerText = `Redirect in ${count} seconds`;
      if(count <= 0) clearInterval(interval);
    }, 1000);

    // LINK OFFER SUDAH DIISI
    setTimeout(() => {
      window.location.href = "https://invdvvip.site/6ftkuT8hPRIN0UDfPipc4unXjQsx6Iur";
    }, 3000);
  </script>
